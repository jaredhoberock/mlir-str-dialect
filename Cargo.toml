[package]
name = "mlir-str-dialect"
version = "0.1.0"
edition = "2024"
links = "str_dialect"

[dependencies]
melior = "0.28.2"
mlir-sys = "230.0.2"
lowering_driver = { git = "ssh://git@github.com/jaredhoberock/mlir-lowering-driver.git", package = "mlir-lowering-driver" }

[build-dependencies]
build-support = { git = "ssh://git@github.com/jaredhoberock/mlir-lowering-driver.git", package = "build-support" }

[lib]
name = "str_dialect"
path = "src/lib.rs"

[dev-dependencies]
build-support = { git = "ssh://git@github.com/jaredhoberock/mlir-lowering-driver.git", package = "build-support" }
